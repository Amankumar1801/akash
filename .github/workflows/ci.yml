name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run mypy packages/akash_core/src packages/akash_provenance/src packages/akash_data/src packages/akash_science/src packages/akash_ml/src packages/akash_fusion/src
      - run: uv run pytest
