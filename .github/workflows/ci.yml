name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run mypy packages/akash_core/src packages/akash_provenance/src packages/akash_data/src packages/akash_science/src packages/akash_ml/src packages/akash_fusion/src packages/akash_agent/src packages/akash_report/src packages/akash_eval/src services/api/src
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  images:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/api.Dockerfile, load: true, tags: "akash-api:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/web.Dockerfile, load: true, tags: "akash-web:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Smoke test the API image (readiness, non-root, preflight)
        run: |
          docker run -d --name api -p 8000:8000 akash-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/v1/ready && break; sleep 2; done
          curl -fsS localhost:8000/v1/health
          test "$(docker exec api id -u)" = "10001"
          docker exec api python scripts/preflight.py
      - name: Validate the production compose file
        run: |
          cp infra/compose/prod.env.example .env
          docker compose -f infra/compose/docker-compose.prod.yml config -q
