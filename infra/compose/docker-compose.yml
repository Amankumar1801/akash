# NOT USED by the current API (it runs on SQLite and in-process jobs). Kept as scaffolding for the
# Postgres, Redis and object-store upgrade path described in docs/deploy.md.
# Local dev dependencies. API/worker run via `uv run` on the host in Phase 0.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: akash, POSTGRES_PASSWORD: akash, POSTGRES_DB: akash }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akash"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: akash, MINIO_ROOT_PASSWORD: akashakash }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
volumes: { pgdata: {}, miniodata: {} }
