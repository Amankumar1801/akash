[project]
name = "akash"
version = "0.0.1"
description = "AKASH: AI Astronomical Discovery Engine (workspace root)"
requires-python = ">=3.11"
dependencies = ["akash-core", "akash-api"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
akash-core = { workspace = true }
akash-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
