[project]
name = "akash"
version = "0.0.1"
description = "AKASH: AI Astronomical Discovery Engine (workspace root)"
requires-python = ">=3.11"
dependencies = ["akash-core", "akash-api", "akash-data", "akash-provenance", "akash-science", "akash-ml", "akash-fusion", "akash-agent", "akash-report", "akash-eval"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
akash-core = { workspace = true }
akash-api = { workspace = true }
akash-data = { workspace = true }
akash-provenance = { workspace = true }
akash-science = { workspace = true }
akash-ml = { workspace = true }
akash-fusion = { workspace = true }
akash-agent = { workspace = true }
akash-report = { workspace = true }
akash-eval = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = "-q -m 'not network'"
markers = ["network: hits real archives (run with -m network)"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501", "B017", "F401"]
"scripts/**" = ["E501"]
"tests/**" = ["E501"]

[[tool.mypy.overrides]]
module = ["astropy.*", "lightgbm.*", "sklearn.*", "torch.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends()/Query()/... as parameter defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
  "akash_api.deps.require", "akash_api.deps.rate_limited"]
