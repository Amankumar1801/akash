[project]
name = "akash-api"
version = "0.0.1"
description = "AKASH FastAPI service (thin routers over library packages)"
requires-python = ">=3.11"
dependencies = ["akash-core", "fastapi>=0.111", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_api"]

[tool.uv.sources]
akash-core = { workspace = true }
