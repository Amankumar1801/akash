[project]
name = "akash-ml"
version = "0.0.1"
description = "ML: transit classifier (LightGBM + 1D CNN), calibration, ensembles, OOD, explanations"
requires-python = ">=3.11"
dependencies = [
  "akash-core", "akash-data", "akash-science",
  "numpy>=1.26", "scikit-learn>=1.4", "lightgbm>=4.3",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_ml"]

[tool.uv.sources]
akash-core = { workspace = true }
akash-data = { workspace = true }
akash-science = { workspace = true }
