[project]
name = "akash-science"
version = "0.0.1"
description = "Deterministic light-curve science: quality, detrending, transit search, views, vetting, injection"
requires-python = ">=3.11"
dependencies = ["akash-core", "akash-data", "akash-provenance", "numpy>=1.26", "astropy>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_science"]

[tool.uv.sources]
akash-core = { workspace = true }
akash-data = { workspace = true }
akash-provenance = { workspace = true }
