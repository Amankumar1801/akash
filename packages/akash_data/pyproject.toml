[project]
name = "akash-data"
version = "0.0.1"
description = "Identity layer, data providers, caching, validation, ingestion"
requires-python = ">=3.11"
dependencies = ["akash-core", "akash-provenance", "httpx>=0.27", "numpy>=1.26", "astropy>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_data"]

[tool.uv.sources]
akash-core = { workspace = true }
akash-provenance = { workspace = true }
