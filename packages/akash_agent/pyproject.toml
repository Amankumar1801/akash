[project]
name = "akash-agent"
version = "0.0.1"
description = "Research agent: read-only tools, cited answers, verification, provider-agnostic LLM seam"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_agent"]
