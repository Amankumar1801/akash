[project]
name = "akash-fusion"
version = "0.0.1"
description = "Cross-survey evidence, rule-based triage, assessments, investigation orchestration"
requires-python = ">=3.11"
dependencies = ["akash-core", "akash-data", "akash-provenance", "akash-science", "akash-ml", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_fusion"]

[tool.uv.sources]
akash-core = { workspace = true }
akash-data = { workspace = true }
akash-provenance = { workspace = true }
akash-science = { workspace = true }
akash-ml = { workspace = true }
