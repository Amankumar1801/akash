[project]
name = "akash-core"
version = "0.0.1"
description = "AKASH domain schemas, enums, ids, config. No web/ML dependencies."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_core"]
