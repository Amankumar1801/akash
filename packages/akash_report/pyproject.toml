[project]
name = "akash-report"
version = "0.0.1"
description = "Deterministic, traceable scientific reports built from stored evidence"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "akash-agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_report"]

[tool.uv.sources]
akash-agent = { workspace = true }
