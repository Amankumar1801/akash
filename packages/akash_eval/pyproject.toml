[project]
name = "akash-eval"
version = "0.0.1"
description = "Injection-recovery experiments with honest statistics"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26", "akash-science", "akash-data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_eval"]

[tool.uv.sources]
akash-science = { workspace = true }
akash-data = { workspace = true }
