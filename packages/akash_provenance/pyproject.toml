[project]
name = "akash-provenance"
version = "0.0.1"
description = "Provenance store: records, edges, lineage queries"
requires-python = ">=3.11"
dependencies = ["akash-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akash_provenance"]

[tool.uv.sources]
akash-core = { workspace = true }
